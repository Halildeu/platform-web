# Gitleaks configuration — false-positive allowlist.
# PR-D1b.B.2 (Codex thread 019e8074, 2026-06-01).
#
# Extends the default gitleaks rule set and adds path-scoped allowlist
# entries for known false-positives. Without `extend.useDefault = true`
# this file would REPLACE (not extend) the bundled rules, leaving the
# scan with zero detection coverage.

[extend]
useDefault = true

[allowlist]
description = "Project-level false-positives"

# `apps/mfe-reporting/src/modules/dynamic-report/filters/widgets/index.tsx`:
# the widget helpers reference `definition.i18nLabelKey` and
# `definition.i18nPlaceholderKey` for i18n string identifiers. The
# generic-api-key rule flags the JS local var assignments because the
# right-hand-side identifier pattern (`...Key`) coupled with the
# variable name happens to score high entropy. These are i18n keys,
# not credentials; allowlist the file.
paths = [
  '''apps/mfe-reporting/src/modules/dynamic-report/filters/widgets/index\.tsx''',
]

# #1021 (owner decision, 2026-09-25): the theme ownership ledgers pin their
# inputs and results with content-addressed SHA-256 digests, which the
# generic-api-key rule reads as credentials ("tokenSourceSha256": "<hex>").
# Commit-bound .gitleaksignore lines do not survive a squash merge and would
# be needed for every new decision, so the exemption is scoped instead to:
#   - this one rule (generic-api-key), and
#   - BOTH the ledger files AND a line that is exactly one "...Sha256" field
#     holding 64 lowercase hex characters.
# Any other value in these files, and the same line in any other file, is
# still reported. Measured with gitleaks 8.24.3 (the CI version): a global
# [[allowlists]] block is not applied there, so the rule-scoped form is used.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "#1021 theme ownership ledger digests"
condition = "AND"
paths = [
  '''(^|/)design-tokens/migrations/theme-ownership-decisions\.v[0-9]+\.json$''',
]
regexTarget = "line"
regexes = [
  '''^\s*"[A-Za-z]+Sha256"\s*:\s*"[0-9a-f]{64}",?\s*$''',
]
