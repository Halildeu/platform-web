# Included inside the existing frontend server. Public-cloud Teams only.
# Authentication must use the approved same-origin Keycloak endpoint; no token
# or client secret is embedded in this static package.
location = /teams/panel {
    return 308 /teams/panel/;
}

location ^~ /teams/panel/ {
    try_files $uri $uri/ =404;
    # OAuth returns carry a code in the query; never log panel query strings.
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; base-uri 'none'; object-src 'none'; form-action 'self'; frame-ancestors https://teams.microsoft.com https://*.teams.microsoft.com https://*.skype.com https://*.office.com https://*.microsoft365.com https://*.cloud.microsoft" always;
    # No X-Frame-Options or COOP same-origin: Teams embedding/login popup need
    # their own window relationship. Upstream proxies must preserve this scope.
}
